modules-search: [ local ]

instances:
- id:       upgrade
  module:   shellprocess
  config:   shellprocess_upgrade.conf
- id:       nvidia
  module:   shellprocess
  config:   shellprocess_nvidia.conf
- id:       cleanup
  module:   shellprocess
  config:   shellprocess_cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@upgrade
  - shellprocess@nvidia
  - bootloader
  - packages
  - shellprocess@cleanup
  - umount
- show:
  - finished

branding: prototype

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
